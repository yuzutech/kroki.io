<svg xmlns="http://www.w3.org/2000/svg" class="kroki-output kroki-output-ascii-snake bob" height="10rem" font-family="arial" font-size="14" viewBox="0 0 72 160">
                <defs>
                    <marker id="triangle" markerHeight="8" markerWidth="8" orient="auto" refX="4" refY="2" viewBox="0 0 8 4">
                        <polygon class="fg_fill" points="0,0 0,4 8,2 0,0"/>
                    </marker>
                    <marker id="clear_triangle" markerHeight="10" markerWidth="10" orient="auto" refX="1" refY="7" viewBox="0 0 20 14">
                        <polygon class="bg_fill fg_stroke" points="2,2 2,12 18,7 2,2"/>
                    </marker>
                    <marker id="circle" markerHeight="5" markerWidth="5" orient="auto" refX="10" refY="10" viewBox="0 0 20 20">
                        <circle class="fg_fill" cx="10" cy="10" r="8"/>
                    </marker>
                    <marker id="square" markerHeight="5" markerWidth="5" orient="auto" refX="10" refY="10" viewBox="0 0 20 20">
                        <rect class="fg_fill" height="20" width="20" x="0" y="0"/>
                    </marker>
                    <marker id="open_circle" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="10" viewBox="0 0 20 20">
                        <circle class="bg_fill fg_stroke" cx="10" cy="10" r="4"/>
                    </marker>
                    <marker id="big_open_circle" markerHeight="20" markerWidth="20" orient="auto" refX="20" refY="20" viewBox="0 0 40 40">
                        <circle class="bg_fill fg_stroke" cx="20" cy="20" r="6"/>
                    </marker>
                </defs>
                <style type="text/css">

                    .kroki-output-ascii-snake rect.backdrop {
                        fill: white;
                    }

                    .kroki-output-ascii-snake .fg_fill {
                        fill: black;
                    }


                    .kroki-output-ascii-snake .bg_fill {
                        fill: white;
                    }

                    .kroki-output-ascii-snake .fg_stroke {
                        stroke: black;
                        stroke-width: 2;
                    }

                    .kroki-output-ascii-snake .no_fill {
                        fill: none;
                    }

                    .kroki-output-ascii-snake .dashed {
                        stroke-dasharray: 5;
                    }

                    .kroki-output-ascii-snake text {
                        fill: black;
                    }

                    .kroki-output-ascii-snake line, .kroki-output-ascii-snake path {
                        stroke-linecap: round;
                        stroke-linejoin: miter;
                        stroke-opacity: 1;
                        fill-opacity: 1;
                    }
                </style>
                
                <g>
                    <line class="fg_stroke" x1="0" x2="8" y1="64" y2="80"/>
                    <line class="fg_stroke" x1="0" x2="16" y1="64" y2="32"/>
                    <line class="fg_stroke" x1="12" x2="8" y1="88" y2="80"/>
                    <line class="fg_stroke" x1="12" x2="12" y1="96" y2="88"/>
                    <line class="fg_stroke" x1="12" x2="12" y1="96" y2="120"/>
                    <line class="fg_stroke" x1="16" x2="60" y1="32" y2="32"/>
                    <line class="fg_stroke" x1="60" x2="60" y1="32" y2="48"/>
                    <line class="fg_stroke" x1="60" x2="52" y1="48" y2="48"/>
                </g>
                <g>
                    <line class="fg_stroke" x1="8" x2="12" y1="128" y2="120"/>
                    <line class="fg_stroke" x1="8" x2="16" y1="128" y2="144"/>
                    <line class="fg_stroke" x1="8" x2="16" y1="160" y2="144"/>
                </g>
                <g>
                    <line class="fg_stroke" x1="24" x2="52" y1="64" y2="64"/>
                    <line class="fg_stroke" x1="52" x2="52" y1="48" y2="64"/>
                </g>
                <g>
                    <line class="fg_stroke" x1="32" x2="40" y1="64" y2="80"/>
                    <line class="fg_stroke" x1="44" x2="40" y1="88" y2="80"/>
                    <line class="fg_stroke" x1="44" x2="44" y1="96" y2="88"/>
                    <line class="fg_stroke" x1="44" x2="44" y1="96" y2="120"/>
                </g>
                <g>
                    <line class="fg_stroke" x1="40" x2="44" y1="128" y2="120"/>
                    <line class="fg_stroke" x1="40" x2="48" y1="128" y2="144"/>
                    <line class="fg_stroke" x1="40" x2="48" y1="160" y2="144"/>
                </g>
                <g>
                    <path class="fg_stroke no_fill" d="M 40 44 A 8 8 0 0 0 48 48"/>
                </g>
                <g>
                    <circle class="fg_stroke no_fill" cx="36" cy="40" r="6"/>
                </g>
            </svg>