                    <text fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="197" x="167" y="106.1367">Personal Banking
                        Customer
                    </text>
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="0" x="267.5" y="125.625" />
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176" x="177.5" y="144.5195">A customer of the bank, with</text>
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154" x="188.5" y="163.4141">personal bank accounts.</text>
                    <rect fill="#1168BD" height="117.1719" style="stroke:#3C7FC0;stroke-width:1.5;" width="215" x="7" y="255.293" />
