                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152" x="38.5" y="320.5195">Allows customers to view</text>
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="175" x="25" y="339.4141">information about their bank</text>
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195" x="17" y="358.3086">accounts, and make payments.</text>
                    <rect fill="#999999" height="98.2773" style="stroke:#8A8A8A;stroke-width:1.5;" width="172" x="331.5" y="264.793" />
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="99" x="368" y="291.6367">E-mail system</text>
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="0" x="419.5" y="311.125" />
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133" x="351" y="330.0195">The internal Microsoft</text>
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152" x="341.5" y="348.9141">Exchange e-mail system.</text>
                    <rect fill="#999999" height="117.1719" style="stroke:#8A8A8A;stroke-width:1.5;" width="215" x="7" y="450.293" />
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="195" x="17" y="477.1367">Mainframe Banking
