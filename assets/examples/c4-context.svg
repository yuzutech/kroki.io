                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182" x="23.5" y="515.5195">Stores all of the core banking</text>
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181" x="22" y="534.4141">information about customers,</text>
                    <text fill="#FFFFFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172" x="28.5" y="553.3086">accounts, transactions, etc.</text>
